name: Тесты и сборка

# Каждое нажатие в ветку запускает проверку кода и сборку исполняемого файла.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Тесты и покрытие (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 psutil

      - name: Статический анализ (flake8)
        run: flake8 app tests

      - name: Автотесты с отчётом по покрытию
        run: |
          pytest -q --cov=app --cov=tests --cov-report=xml --cov-report=html

      - name: Отчёт по покрытию (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn

  build:
    name: Сборка .exe
    runs-on: windows-latest
    needs: test
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Подготовить окружение
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 pyinstaller
          python tools/make_icon.py

      - name: Прогнать тесты перед сборкой
        run: pytest -q

      - name: Собрать исполняемый файл
        run: pyinstaller BatchImageStudio.spec --noconfirm --clean

      - name: Приложить BatchImageStudio.exe
        uses: actions/upload-artifact@v4
        with:
          name: BatchImageStudio-windows
          path: dist/BatchImageStudio.exe
          if-no-files-found: error